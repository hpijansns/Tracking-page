<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saraswati Book Publication - Dispatch Admin</title>
    <style>
        :root { --primary: #1e3a8a; --accent: #2563eb; --bg: #f1f5f9; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); padding: 25px 15px; display: flex; justify-content: center; }
        .card { background: white; width: 100%; max-width: 680px; padding: 30px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
        .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #e2e8f0; padding-bottom: 16px; margin-bottom: 20px; }
        .title { color: var(--primary); font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .tag { background: #dbeafe; color: var(--primary); font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 700; }
        .section-label { font-size: 12px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin: 18px 0 10px 0; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
        input, select, textarea { width: 100%; padding: 11px 13px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
        .btn-gen { background: #e2e8f0; color: #1e293b; padding: 11px 14px; border: none; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 700; white-space: nowrap; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 15px; }
        .btn-main:hover { background: #172554; }
        
        .result-box { display: none; margin-top: 25px; background: #f0fdf4; border: 1.5px dashed #22c55e; padding: 20px; border-radius: 12px; }
        .code-display { font-size: 22px; font-weight: 800; color: #15803d; letter-spacing: 1.5px; margin: 5px 0; }
        .share-btn { background: #16a34a; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <div class="title">📚 Saraswati Book Publication</div>
        <div class="tag">Internal Dispatch Manager</div>
    </div>

    <!-- 1. Candidate Details -->
    <div class="section-label">1. Candidate & Project Information</div>
    <div class="grid-2">
        <div class="form-group">
            <label>Consignment / Tracking No.</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="trkCode" placeholder="SBP-HW-849102">
                <button class="btn-gen" onclick="generateCode()">Auto</button>
            </div>
        </div>
        <div class="form-group">
            <label>Candidate Enrollment ID</label>
            <input type="text" id="candId" value="SBP-2026-REG-4891">
        </div>
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label>Candidate Full Name</label>
            <input type="text" id="candName" placeholder="e.g. Ramesh Kumar">
        </div>
        <div class="form-group">
            <label>Destination City & State</label>
            <input type="text" id="destCity" placeholder="e.g. Jaipur, Rajasthan">
        </div>
    </div>

    <div class="form-group">
        <label>Project / Manuscript Title</label>
        <input type="text" id="projTitle" value="NCERT Hindi Literature Manuscript (Transcribe Project)">
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label>Assigned Workload</label>
            <input type="text" id="workload" value="95 Pages (Single-side Ruled)">
        </div>
        <div class="form-group">
            <label>Project Remuneration (मानदेय)</label>
            <input type="text" id="payout" value="₹8,500 upon quality verification">
        </div>
    </div>

    <!-- 2. Kit Details -->
    <div class="section-label">2. Assignment Kit Material Specs</div>
    <div class="form-group">
        <label>Dispatched Kit Material</label>
        <input type="text" id="kitDesc" value="1x Master Copy (Printed Reference) + 1x Blank Evaluation Register + Guideline Slip">
    </div>

    <!-- 3. Logistics & Current Status -->
    <div class="section-label">3. Shipment Movement & Current Hub</div>
    <div class="grid-2">
        <div class="form-group">
            <label>Current Status Stage</label>
            <select id="statusStep" onchange="autoFillLocation()">
                <option value="1">1. Dispatch Manifested (Publication Press)</option>
                <option value="2">2. In Transit (Inter-District Postal Hub)</option>
                <option value="3">3. Arrived at Destination Hub (City Center)</option>
                <option value="4" selected>4. Out for Delivery (Postman Assigned)</option>
                <option value="5">5. Delivered Successfully</option>
            </select>
        </div>
        <div class="form-group">
            <label>Current Logistics Hub Name</label>
            <input type="text" id="currLoc" placeholder="e.g. Jaipur RMS Speed Post Hub">
        </div>
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label>Dispatch Origin Hub</label>
            <input type="text" id="origLoc" value="New Delhi Central Publishing Press">
        </div>
        <div class="form-group">
            <label>Submission Due Timeline</label>
            <input type="text" id="deadline" value="15 Days from date of parcel delivery">
        </div>
    </div>

    <button class="btn-main" onclick="createShipment()">Generate Candidate Tracking Link 🚀</button>

    <div class="result-box" id="resultBox">
        <div style="font-size: 13px; color: #166534; font-weight: bold;">✅ Assignment Kit Tracking Active!</div>
        <div class="code-display" id="dispCode">SBP-HW-000000</div>
        <button class="share-btn" onclick="copyTrackingUrl()">📋 Copy Tracking Link (कैंडिडेट को भेजने के लिए)</button>
    </div>
</div>

<script>
    function generateCode() {
        const rand = Math.floor(100000 + Math.random() * 900000);
        document.getElementById('trkCode').value = 'SBP-HW-' + rand;
    }
    generateCode();

    function autoFillLocation() {
        const step = document.getElementById('statusStep').value;
        const city = document.getElementById('destCity').value || "Destination City";
        const loc = document.getElementById('currLoc');

        if(step === "1") loc.value = "New Delhi Central Publishing Facility (Dispatch Bay 4)";
        else if(step === "2") loc.value = "National Transit Mail Sorting Hub";
        else if(step === "3") loc.value = city + " Divisional Speed Post / Parcel Hub";
        else if(step === "4") loc.value = city + " Local Delivery Center (On Delivery Route)";
        else if(step === "5") loc.value = city + " (Delivered to Candidate)";
    }

    let readyLink = "";

    function createShipment() {
        const data = {
            trk: document.getElementById('trkCode').value.trim(),
            candId: document.getElementById('candId').value.trim(),
            name: document.getElementById('candName').value.trim(),
            city: document.getElementById('destCity').value.trim(),
            proj: document.getElementById('projTitle').value.trim(),
            work: document.getElementById('workload').value.trim(),
            pay: document.getElementById('payout').value.trim(),
            kit: document.getElementById('kitDesc').value.trim(),
            step: parseInt(document.getElementById('statusStep').value),
            currLoc: document.getElementById('currLoc').value.trim(),
            origLoc: document.getElementById('origLoc').value.trim(),
            dead: document.getElementById('deadline').value.trim()
        };

        if(!data.trk || !data.name || !data.city) {
            alert("कृपया नाम, शहर और ट्रैकिंग कोड भरें!");
            return;
        }

        // Local storage backup
        localStorage.setItem("SBP_" + data.trk, JSON.stringify(data));

        // URL encode
        const encoded = encodeURIComponent(JSON.stringify(data));
        const curUrl = window.location.href;
        readyLink = curUrl.substring(0, curUrl.lastIndexOf('/')) + '/track.html?kit=' + encoded;

        document.getElementById('dispCode').innerText = data.trk;
        document.getElementById('resultBox').style.display = 'block';
    }

    function copyTrackingUrl() {
        navigator.clipboard.writeText(readyLink);
        alert("ट्रैकिंग लिंक कॉपी हो गया! अब इसे कैंडिडेट या दोस्त को भेजें।");
    }
</script>

</body>
</html>
